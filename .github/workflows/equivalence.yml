name: Release A Output Equivalence

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    paths:
      - "scripts/**"
      - "source/**"
      - "jobs/**"
      - "scratch/jd_library/**"
      - "evals/equivalence/**"
      - "tasks.py"
      - "requirements.txt"
      - ".github/workflows/equivalence.yml"

jobs:
  equivalence:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RESUME_EQUIVALENCE_TRANSIENT_ROOT: C:\e

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned rendering toolchain
        shell: powershell
        run: |
          choco install libreoffice-fresh --version=7.6.5 -y --allow-downgrade
          choco install poppler --version=26.5.0 -y --allow-downgrade
          if ([string]::IsNullOrWhiteSpace($env:ChocolateyInstall)) {
            Write-Host "::error title=Poppler discovery::ChocolateyInstall is empty after installing the pinned renderers"
            throw "ChocolateyInstall is empty after installing the pinned renderers"
          }
          Write-Host "ChocolateyInstall: $env:ChocolateyInstall"
          $popplerRoot = Join-Path $env:ChocolateyInstall "lib\poppler"
          if (-not (Test-Path -LiteralPath $popplerRoot)) {
            Write-Host "::error title=Poppler discovery::Poppler search root is missing: $popplerRoot"
            throw "Poppler search root is missing: $popplerRoot"
          }
          $popplerCandidates = @(
            Get-ChildItem -LiteralPath $popplerRoot -Filter "pdftoppm.exe" -File -Recurse |
              Where-Object { Test-Path -LiteralPath (Join-Path $_.DirectoryName "pdfinfo.exe") } |
              Sort-Object { $_.FullName.ToLowerInvariant() }
          )
          Write-Host "Poppler executable candidates ($($popplerCandidates.Count)):"
          $popplerCandidates | ForEach-Object { Write-Host "  $($_.FullName)" }
          if ($popplerCandidates.Count -ne 1) {
            Write-Host "::error title=Poppler discovery::Expected exactly one pdftoppm.exe/pdfinfo.exe pair beneath $popplerRoot; found $($popplerCandidates.Count)"
            throw "Expected exactly one pdftoppm.exe/pdfinfo.exe pair beneath $popplerRoot; found $($popplerCandidates.Count)"
          }
          $popplerDirectory = $popplerCandidates[0].DirectoryName
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $popplerDirectory
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RESUME_CI_POPPLER_DIR=$popplerDirectory"
          Write-Host "Exported Poppler directory for subsequent steps: $popplerDirectory"

      - name: Verify exact renderer versions
        run: python scripts/ci_renderer_probe.py

      - name: Prove planted changes are detected
        run: python tasks.py equivalence-compare --candidate HEAD --self-test

      - name: Compare candidate with Release A
        run: python tasks.py equivalence-compare --baseline a14fb43 --candidate HEAD

      - name: Upload normalized failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-reports
          path: C:\e\reports\*.json
          if-no-files-found: ignore
          retention-days: 14
