name: Release A Output Equivalence

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    paths:
      - "scripts/**"
      - "source/**"
      - "jobs/**"
      - "scratch/jd_library/**"
      - "evals/equivalence/**"
      - "tasks.py"
      - "requirements.txt"
      - ".github/workflows/equivalence.yml"

jobs:
  equivalence:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RESUME_EQUIVALENCE_TRANSIENT_ROOT: C:\e

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned rendering toolchain
        shell: powershell
        run: |
          choco install libreoffice-fresh --version=7.6.5 -y --allow-downgrade
          choco install poppler --version=26.5.0 -y --allow-downgrade

      - name: Verify exact renderer versions
        shell: powershell
        run: |
          $soffice = "C:\Program Files\LibreOffice\program\soffice.com"
          if (-not (Test-Path -LiteralPath $soffice)) { throw "Pinned LibreOffice executable is missing" }
          $loVersion = (& $soffice --version | Out-String).Trim()
          if ($loVersion -notmatch "LibreOffice 7\.6\.5\.2\b") { throw "Unexpected LibreOffice version: $loVersion" }
          $poppler = (Get-Command pdftoppm -ErrorAction Stop).Source
          $popplerVersion = (& $poppler -v 2>&1 | Out-String).Trim()
          if ($popplerVersion -notmatch "pdftoppm version 26\.05\.0\b") { throw "Unexpected Poppler version: $popplerVersion" }

      - name: Prove planted changes are detected
        run: python tasks.py equivalence-compare --candidate HEAD --self-test

      - name: Compare candidate with Release A
        run: python tasks.py equivalence-compare --baseline a14fb43 --candidate HEAD

      - name: Upload normalized failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-reports
          path: C:\e\reports\*.json
          if-no-files-found: ignore
          retention-days: 14
