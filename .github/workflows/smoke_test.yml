name: Resume System Smoke Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Clean-startup checks
        run: |
          python tasks.py help
          python tasks.py commands
          python -c "import subprocess,sys; result=subprocess.run([sys.executable, 'tasks.py', 'doctor']); raise SystemExit(0 if result.returncode in (0, 2) else result.returncode)"

      - name: Resume system smoke test
        run: python tasks.py validate
